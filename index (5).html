<style>:root{--bg:#07090e;--p1:#0f1420;--p2:#161d2d;--line:#26324b;--ink:#e9eff9;--mut:#8b97ae;--acc:#00e5ff;--red:#ff3b5c;--yel:#ffc400;--vio:#a66cff;--ok:#2be28a;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg)}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.top,#hud,.stagewrap,#ctl,#panel,.foot{position:relative;z-index:1}
body{position:relative;color:var(--ink);font-family:'Rajdhani','Hind Siliguri',system-ui,sans-serif;font-weight:600;font-size:16px;display:flex;flex-direction:column;align-items:center;padding:0 12px 100px;-webkit-user-select:none;user-select:none;min-height:100vh;background:transparent}
.top{width:100%;max-width:440px;display:flex;align-items:center;gap:8px;padding:12px 0 10px}
.logo{flex:1;font-family:'Russo One','Rajdhani',sans-serif;font-size:1.3rem;letter-spacing:.07em;text-transform:uppercase;line-height:1}
.logo i{font-style:normal;color:var(--red)}
.logo small{display:block;font-family:'Rajdhani','Hind Siliguri',sans-serif;font-size:.62rem;letter-spacing:.2em;color:var(--mut);margin-top:3px}
.ib{width:40px;height:40px;display:none;align-items:center;justify-content:center;background:var(--p2);border:1px solid var(--line);border-radius:10px;color:var(--ink);cursor:pointer;padding:0;font:inherit;font-weight:700;font-size:.78rem}
.ib.show{display:inline-flex}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib.on{color:var(--acc);border-color:var(--acc)}.ib.warn{color:var(--red);border-color:var(--red)}
.card{width:100%;max-width:440px;background:linear-gradient(160deg,var(--p2),var(--p1));border:1px solid var(--line);padding:16px;margin-top:12px;clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,0 100%)}
.card:empty{display:none}
h2{margin:0 0 10px;font-family:'Russo One','Rajdhani',sans-serif;font-weight:400;font-size:1.05rem;letter-spacing:.08em;text-transform:uppercase}
h2 em{font-style:normal;color:var(--acc)}
.sub{color:var(--mut);font-size:.9rem;margin:2px 0 10px;line-height:1.35}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;font:inherit;font-weight:700;font-size:1.02rem;letter-spacing:.06em;text-transform:uppercase;color:#fff;border:0;border-radius:10px;padding:13px 16px;margin:8px 0;cursor:pointer;background:linear-gradient(90deg,var(--red),#ff7a3b);box-shadow:0 3px 0 rgba(0,0,0,.45),0 0 18px rgba(255,59,92,.25)}
.btn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.45)}
.btn.sec{background:var(--p2);border:1px solid var(--acc);color:var(--acc);box-shadow:none}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);box-shadow:none}
.btn.go{background:linear-gradient(90deg,#14c97a,#00e5ff);color:#04110d}
.btn[disabled]{opacity:.4;filter:grayscale(.7);pointer-events:none}
.btn.sm{display:inline-flex;width:auto;padding:7px 14px;font-size:.82rem;margin:2px}
.row{display:flex;gap:8px;align-items:center}
input,select{font:inherit;font-weight:600;width:100%;padding:12px 14px;margin:5px 0;background:#0a0f19;color:var(--ink);border:1px solid var(--line);border-radius:10px;outline:none}
input:focus,select:focus{border-color:var(--acc)}
input[type=range]{padding:0;margin:0;accent-color:var(--red);height:28px;background:none;border:0}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tab{flex:1;font:inherit;font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-size:.85rem;padding:10px 4px;border-radius:8px;border:1px solid var(--line);background:var(--p1);color:var(--mut);cursor:pointer}
.tab.on{color:#fff;border-color:var(--red);background:rgba(255,59,92,.14)}
.err{color:var(--red);font-size:.9rem;min-height:1.2em;margin:4px 0 8px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.kv div{background:#0a0f19;border:1px solid var(--line);border-radius:10px;padding:10px 4px;text-align:center}
.kv b{display:block;font-family:'Russo One','Rajdhani',sans-serif;font-weight:400;font-size:1.4rem;color:var(--acc);line-height:1.1}
.kv span{font-size:.72rem;letter-spacing:.08em;color:var(--mut);text-transform:uppercase}
.code{font-family:'Russo One',sans-serif;font-size:2.4rem;letter-spacing:.35em;text-align:center;color:var(--acc);margin:4px 0 8px;text-shadow:0 0 20px rgba(0,229,255,.5)}
table{width:100%;border-collapse:collapse;font-size:.95rem}td,th{padding:7px 4px;text-align:left;border-bottom:1px solid var(--line)}th{color:var(--mut);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:7px}.dot.off{background:#555}
.lvl{display:inline-block;background:var(--red);color:#fff;border-radius:4px;padding:0 6px;font-size:.75rem;letter-spacing:.06em}
.pc{display:flex;align-items:center;gap:12px;background:#0a0f19;border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin:7px 0}
.pc.eq{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.pc .pi{flex:1;line-height:1.2}.pc .pi i{display:block;font-style:normal;color:var(--mut);font-size:.8rem}
.sw{width:48px;height:10px;border-radius:5px;box-shadow:0 0 10px currentColor}
.tag{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ok)}.tag.l{color:var(--mut)}
.chal{background:rgba(255,196,0,.1);border:1px solid var(--yel);border-radius:10px;padding:10px;margin:8px 0;text-align:center}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:8px}
.seg button{flex:1;font:inherit;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:.85rem;padding:9px;border:0;background:var(--p1);color:var(--mut);cursor:pointer}
.seg button.on{background:var(--red);color:#fff}
#hud{display:flex;gap:6px;width:100%;max-width:440px;margin-top:2px}
.fc{flex:1;min-width:0;background:linear-gradient(180deg,var(--p2),var(--p1));border:1px solid var(--line);border-top:3px solid var(--c);padding:6px 8px;border-radius:6px}
.fc.turn{box-shadow:0 0 0 1px var(--c),0 0 16px -2px var(--c)}
.fn{font-weight:700;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fm{font-size:.66rem;color:var(--mut);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pips{display:flex;gap:3px;margin-top:5px;flex-wrap:wrap}.pips i{width:10px;height:6px;background:#27324a;border-radius:2px}.pips i.on{background:var(--c);box-shadow:0 0 6px var(--c)}
.stagewrap{width:100%;max-width:440px;margin-top:8px;display:none}
.stage{position:relative;width:100%;aspect-ratio:1/1;border-radius:10px;overflow:hidden;background:#05070b;box-shadow:0 0 0 1px var(--line),0 24px 50px rgba(0,0,0,.65)}
#cv{width:100%;height:100%;display:block;touch-action:none}
.banner{position:absolute;left:50%;top:10px;transform:translateX(-50%);max-width:92%;text-align:center;font-size:.92rem;letter-spacing:.05em;padding:6px 14px;background:rgba(7,9,14,.82);border:1px solid var(--line);border-radius:999px;pointer-events:none;z-index:20}

.ov{position:absolute;inset:0;z-index:50;background:#06080d;opacity:0;pointer-events:none;transition:opacity .5s}
.ov.show{opacity:1}
.mapsvg{position:absolute;inset:0;width:100%;height:100%;padding:30px 10px 6px}
.mtitle{position:absolute;top:10px;left:0;right:0;text-align:center;font-family:'Russo One',sans-serif;font-size:.8rem;letter-spacing:.25em;color:var(--acc);text-transform:uppercase}
.mk{opacity:0;animation:mkin .5s forwards}@keyframes mkin{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}

.vline{stroke-dashoffset:300;animation:dash 2.2s 1.2s forwards}@keyframes dash{to{stroke-dashoffset:0}}

@keyframes sl{from{transform:translateX(-120%);opacity:0}to{transform:none;opacity:1}}@keyframes sr{from{transform:translateX(120%);opacity:0}to{transform:none;opacity:1}}

@keyframes pop{from{transform:translate(-50%,-50%) scale(3);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.fx{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle,#2a0a12,#06080d 70%)}
.fx small{letter-spacing:.4em;text-transform:uppercase;color:var(--mut)}

@keyframes punch{from{transform:scale(2.6);opacity:0}to{transform:scale(1);opacity:1}}
#ctl{display:none;width:100%;max-width:440px;margin-top:10px}
#ctl .row{margin:6px 0}#ctl label{width:70px;color:var(--mut);font-size:.8rem;letter-spacing:.1em;text-transform:uppercase}#ctl b{width:38px;text-align:right}
#act{display:none;position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;width:min(92%,400px);margin:0;padding:15px;font-size:1.15rem;box-shadow:0 4px 0 rgba(0,0,0,.5),0 0 28px rgba(255,59,92,.45)}
.foot{margin-top:18px;font-size:.78rem;color:var(--mut);text-align:center}.foot a{color:var(--acc);text-decoration:none}
html[lang=bn] *{letter-spacing:0!important}

.hero{display:block;width:100%;max-width:440px;height:150px;margin-top:6px}
.rise{animation:rise .45s both}@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.logo i{animation:lg 2.2s ease-in-out infinite alternate}@keyframes lg{from{text-shadow:0 0 6px rgba(255,59,92,.4)}to{text-shadow:0 0 22px rgba(255,59,92,.95)}}
.btn:not(.sec):not(.ghost){position:relative;overflow:hidden}
.btn:not(.sec):not(.ghost)::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:sheen 3.8s infinite}
@keyframes sheen{0%,55%{left:-60%}100%{left:130%}}
.card{backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);background:linear-gradient(160deg,rgba(24,32,50,.88),rgba(13,18,30,.9))}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

  ch.on('broadcast',{event:'m'},function(e){var p=e.payload||{};(hs[p.topic]||[]).forEach(function(f){f({topic:p.topic,data:p.data,peer:p.peer,sameTab:p.peer===myId,isMe:p.peer===myId})})});

    var left=Object.keys(prev).filter(function(k){return!cur[k]}).map(function(k){return{peer:k}});prev=cur;
    ph.forEach(function(f){f({peers:l,joined:[],left:left,updated:[]})})});

    on:function(t,f){(hs[t]=hs[t]||[]).push(f);return function(){}},
    presence:function(p){Object.assign(pres,p);return ch.track(pres)},
    peers:list,onPeers:function(f){ph.push(f);return function(){}},connected:function(){return true},
    leave:function(){return SB.removeChannel(ch)}};
  ch.subscribe(function(status){if(status==='SUBSCRIBED'){ch.track(pres);res(room)}else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'||status==='CLOSED'){rej(new Error(status))}});

  if(!H)return;var d=m.data||{},seat=H.seats[m.peer];
  if(d.t==='hello'){
    var p={uid:m.peer,name:String(d.name||'Player').slice(0,12),dist:+d.dist>=0?+d.dist:-1,lv:clamp(+d.lv||1,1,15)};

function onChal(m){var d=m.data||{};if(d.to!==myUid()||d.from===myUid())return;CHALL={in:{from:d.from,code:d.code,pts:d.pts,name:d.name||'?',dist:d.dist,lv:d.lv||1}};sfx.alert();if(VIEW==='lobby')lobbyUI()}

/* ---------- voice chat ---------- */
var VC={stream:null,pcs:{},q:{},muted:false};
function onPeers(c){lastPeers=c.peers;c.left.forEach(function(p){if(VC.pcs[p.peer]){VC.pcs[p.peer].close();delete VC.pcs[p.peer]}});if(VC.stream)connectVoice();if(ST)render()}
async function voiceToggle(){
  if(!RM)return;
  if(!VC.stream){
    try{VC.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})}catch(e){msg(t('micFail'));return}
    RM.presence({voice:true,muted:false});connectVoice();
  }else{VC.muted=!VC.muted;VC.stream.getAudioTracks().forEach(function(x){x.enabled=!VC.muted});RM.presence({voice:true,muted:VC.muted})}
  lastKey='';updateBar();render();
}
function connectVoice(){lastPeers.forEach(function(p){if(!p.isMe&&p.presence&&p.presence.voice&&!VC.pcs[p.peer]&&me.peer&&me.peer<p.peer)mkPC(p.peer,true)})}
function mkPC(id,init){
  var pc=new RTCPeerConnection({iceServers:CONFIG.ICE});VC.pcs[id]=pc;
  VC.stream.getTracks().forEach(function(x){pc.addTrack(x,VC.stream)});
  pc.onicecandidate=function(e){if(e.candidate)RM.emit('sig',{to:id,k:'c',c:e.candidate.toJSON()}).catch(function(){})};
  pc.ontrack=function(e){var a=document.createElement('audio');a.autoplay=true;a.srcObject=e.streams[0];$('audios').appendChild(a);a.play().catch(function(){})};
  if(init)pc.createOffer().then(function(o){return pc.setLocalDescription(o)}).then(function(){RM.emit('sig',{to:id,k:'o',s:{type:pc.localDescription.type,sdp:pc.localDescription.sdp}}).catch(function(){})});
  return pc;
}
async function onSig(m){
  var d=m.data||{};if(m.isMe||d.to!==me.peer||!VC.stream)return;var id=m.peer,pc=VC.pcs[id];
  try{
    if(!pc)pc=mkPC(id,false);
    if(d.k==='o'){await pc.setRemoteDescription(d.s);var a=await pc.createAnswer();await pc.setLocalDescription(a);RM.emit('sig',{to:id,k:'a',s:{type:a.type,sdp:a.sdp}}).catch(function(){});flush(id,pc)}
    else if(d.k==='a'){await pc.setRemoteDescription(d.s);flush(id,pc)}
    else if(d.k==='c'){if(pc.remoteDescription)await pc.addIceCandidate(d.c);else(VC.q[id]=VC.q[id]||[]).push(d.c)}
  }catch(e){}
}
function flush(id,pc){(VC.q[id]||[]).forEach(function(c){pc.addIceCandidate(c).catch(function(){})});VC.q[id]=[]}
function stopVoice(){Object.keys(VC.pcs).forEach(function(k){try{VC.pcs[k].close()}catch(e){}});VC.pcs={};VC.q={};if(VC.stream)VC.stream.getTracks().forEach(function(x){x.stop()});VC.stream=null;VC.muted=false;$('audios').innerHTML=''}

/* ---------- motion graphics: living background + home fight loop ---------- */
var RM_REDUCE=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var bg=$('bg'),bx=bg.getContext('2d'),BGP=[],BGS=[],bgNext=0,bgLast=0;
function bgResize(){var d=Math.min(1.5,window.devicePixelRatio||1);bg.width=Math.round(innerWidth*d);bg.height=Math.round(innerHeight*d);bg._d=d;BGP=[];for(var i=0;i<42;i++)BGP.push({x:Math.random(),y:Math.random(),r:.6+Math.random()*1.8,v:.01+Math.random()*.035,c:i%3===0?'255,59,92':(i%3===1?'0,229,255':'166,108,255'),a:.25+Math.random()*.5,p:Math.random()*6.28})}
window.addEventListener('resize',bgResize);bgResize();
function bgFrame(ts){
  requestAnimationFrame(bgFrame);
  if(ts-bgLast<30)return;var dt=Math.min(.06,(ts-bgLast)/1000);bgLast=ts;
  var W=bg.width,Hh=bg.height,t=ts/1000;
  bx.setTransform(1,0,0,1,0,0);bx.globalCompositeOperation='source-over';bx.globalAlpha=1;
  var g=bx.createLinearGradient(0,0,0,Hh);g.addColorStop(0,'#060810');g.addColorStop(1,'#0a1020');bx.fillStyle=g;bx.fillRect(0,0,W,Hh);
  [[.2,.18,'255,59,92',.22],[.85,.32,'0,229,255',.18],[.5,.72,'166,108,255',.16]].forEach(function(b,i){
    var cx0=W*(b[0]+Math.sin(t*.22+i*2)*.12),cy0=Hh*(b[1]+Math.cos(t*.18+i)*.1),r=Math.max(W,Hh)*.55;
    var rg=bx.createRadialGradient(cx0,cy0,0,cx0,cy0,r);rg.addColorStop(0,'rgba('+b[2]+','+b[3]+')');rg.addColorStop(1,'rgba('+b[2]+',0)');bx.fillStyle=rg;bx.fillRect(0,0,W,Hh)});
  /* moving perspective grid */
  var hz=Hh*.62;bx.strokeStyle='rgba(0,229,255,.13)';bx.lineWidth=1;
  for(var i=0;i<14;i++){var k=((i+(t*.35)%1)/14),y=hz+(Hh-hz)*k*k;bx.globalAlpha=.25+k*.75;bx.beginPath();bx.moveTo(0,y);bx.lineTo(W,y);bx.stroke()}
  bx.globalAlpha=.5;for(var j=-8;j<=8;j++){bx.beginPath();bx.moveTo(W/2+j*W*.02,hz);bx.lineTo(W/2+j*W*.16,Hh);bx.stroke()}
  bx.globalAlpha=1;
  /* particles */
  bx.globalCompositeOperation='lighter';
  BGP.forEach(function(p){p.y-=p.v*dt;if(p.y<-.02){p.y=1.02;p.x=Math.random()}p.p+=dt;var a=p.a*(.6+.4*Math.sin(p.p*2));bx.fillStyle='rgba('+p.c+','+a+')';bx.beginPath();bx.arc(p.x*W,p.y*Hh,p.r*bg._d,0,6.283);bx.fill()});
  /* flying pen streaks */
  if(!RM_REDUCE&&t>bgNext){bgNext=t+1.8+Math.random()*2.4;var a=(Math.random()<.5?1:-1)*(.35+Math.random()*.4),sx=a>0?-.1:1.1;BGS.push({x:sx*W,y:Hh*(.1+Math.random()*.6),vx:(a>0?1:-1)*W*(1.1+Math.random()*.7),vy:Hh*(Math.random()*.4-.1),c:Math.random()<.5?'255,59,92':'0,229,255',l:1.2})}
  BGS=BGS.filter(function(s){s.l-=dt;s.x+=s.vx*dt;s.y+=s.vy*dt;if(s.l<=0||s.x<-W*.3||s.x>W*1.3)return false;
    var L=70*bg._d,n=Math.hypot(s.vx,s.vy),ux=s.vx/n,uy=s.vy/n,tg=bx.createLinearGradient(s.x,s.y,s.x-ux*L*3,s.y-uy*L*3);tg.addColorStop(0,'rgba('+s.c+',.55)');tg.addColorStop(1,'rgba('+s.c+',0)');
    bx.strokeStyle=tg;bx.lineWidth=3*bg._d;bx.beginPath();bx.moveTo(s.x,s.y);bx.lineTo(s.x-ux*L*3,s.y-uy*L*3);bx.stroke();
    bx.strokeStyle='rgba(255,255,255,.9)';bx.lineWidth=4*bg._d;bx.beginPath();bx.moveTo(s.x,s.y);bx.lineTo(s.x-ux*L*.45,s.y-uy*L*.45);bx.stroke();return true});
  bx.globalCompositeOperation='source-over';
  var vg=bx.createRadialGradient(W/2,Hh/2,Math.min(W,Hh)*.3,W/2,Hh/2,Math.max(W,Hh)*.75);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.55)');bx.fillStyle=vg;bx.fillRect(0,0,W,Hh);
}
requestAnimationFrame(bgFrame);
/* home hero: a looping pen fight (scripted) */
var hero={sp:[],cyc:-1,flash:0,shake:0};
function heroPen(c,x,y,a,L,col,glow,al){c.save();c.translate(x,y);c.rotate(a);c.globalAlpha=al;c.shadowColor=glow;c.shadowBlur=14;c.fillStyle=col;c.fillRect(-L/2,-5.5,L,11);c.shadowBlur=0;
  var g=c.createLinearGradient(0,-5.5,0,5.5);g.addColorStop(0,'rgba(255,255,255,.55)');g.addColorStop(.45,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(0,0,0,.5)');c.fillStyle=g;c.fillRect(-L/2,-5.5,L,11);
  c.fillStyle=glow;c.fillRect(-L*.14,-6,L*.16,12);c.fillStyle='#14171d';c.fillRect(-L/2,-5.5,L*.1,11);
  c.beginPath();c.moveTo(L/2,-5.5);c.lineTo(L/2+10,0);c.lineTo(L/2,5.5);c.closePath();c.fillStyle='#e8edf5';c.fill();c.restore()}
function heroFrame(ts){
  requestAnimationFrame(heroFrame);
  var cv2=$('hero');if(!cv2)return;var d=Math.min(2,window.devicePixelRatio||1),W=cv2.clientWidth,Hh=cv2.clientHeight;if(!W)return;
  if(cv2.width!==Math.round(W*d)){cv2.width=Math.round(W*d);cv2.height=Math.round(Hh*d)}
  var c=cv2.getContext('2d'),t=RM_REDUCE?1.0:(ts/1000)%7,cyc=Math.floor(ts/7000),dt=.016;
  c.setTransform(d,0,0,d,0,0);c.clearRect(0,0,W,Hh);
  if(cyc!==hero.cyc){hero.cyc=cyc;hero.did=false}
  var y0=Hh*.55,x0=W*.27,x1=W*.7,L=70,gap=L+12;
  var sh=hero.shake;hero.shake*=.86;c.translate((Math.random()-.5)*sh,(Math.random()-.5)*sh);
  /* platform strip */
  c.fillStyle='rgba(14,22,36,.85)';c.fillRect(W*.06,y0+16,W*.88,10);c.fillStyle='#00e5ff';c.globalAlpha=.7;c.fillRect(W*.06,y0+16,W*.88,2);c.globalAlpha=1;
  var redX=x0,cyX=x1,cyY=y0,cyA=0,cyAl=1,redAl=1;
  if(t<.9){redX=x0+Math.sin(t*5)*1.5;cyX=x1+Math.sin(t*5+1)*1.5}
  else if(t<1.1){redX=x0-9*Math.sin((t-.9)/.2*1.57)}
  else if(t<1.42){var u=(t-1.1)/.32;redX=x0-9+(x1-gap-x0+9)*u*u}
  else{redX=x1-gap+Math.min(26,(t-1.42)*60);if(t>4.8)redX=x1-gap+26+(x0-x1+gap-26)*Math.min(1,ease((t-4.8)/.6))}
  if(t>=1.42&&t<5){var tt=t-1.42;cyX=x1+tt*tt*-0+ (W*.5)*(1-Math.exp(-tt*3.2));cyY=y0-tt*70+tt*tt*40;cyA=tt*9;cyAl=Math.max(0,1-tt*1.4)}
  if(t>=5&&t<5.7){cyAl=Math.min(1,(t-5)/.6);cyX=x1;cyY=y0;cyA=0}
  if(t>=1.42&&!hero.did&&!RM_REDUCE){hero.did=true;hero.flash=.5;hero.shake=7;for(var i=0;i<26;i++){var a=Math.random()*6.283,s=70+Math.random()*190;hero.sp.push({x:x1-gap+L/2+12,y:y0,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.4+Math.random()*.4,m:.7,c:Math.random()<.5?'#fff3b0':'#ffb300'})}hero.ring={x:x1-gap+L/2+12,y:y0,r:4,l:.45}}
  if(t>=1.42&&cyAl>0&&t<2.2){for(var q=1;q<6;q++){var tq=t-1.42-q*.03;if(tq>0){c.globalAlpha=cyAl*(1-q/6)*.35;c.fillStyle='#00e5ff';c.fillRect(x1+(W*.5)*(1-Math.exp(-tq*3.2))-L/2,y0-tq*70+tq*tq*40-5,L,10)}}c.globalAlpha=1}
  if(t<1.1){c.strokeStyle='#fff';c.globalAlpha=.55+.4*Math.sin(t*9);c.lineWidth=2.5;c.setLineDash([8,6]);c.beginPath();c.moveTo(x0+L/2+18,y0);c.lineTo(x1-L/2-6,y0);c.stroke();c.setLineDash([]);c.globalAlpha=1}
  heroPen(c,redX,y0,0,L,'#c9d2e0','#ff3b5c',redAl);
  if(cyAl>0)heroPen(c,cyX,cyY,Math.PI+cyA,L,'#9fb8c9','#00e5ff',cyAl);
  c.globalCompositeOperation='lighter';
  hero.sp=hero.sp.filter(function(p){p.l-=dt;if(p.l<=0)return false;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.94;p.vy*=.94;c.globalAlpha=p.l/p.m;c.fillStyle=p.c;c.fillRect(p.x-1.5,p.y-1.5,3,3);return true});
  if(hero.ring){var r=hero.ring;r.l-=dt;if(r.l<=0)hero.ring=null;else{r.r+=dt*210;c.globalAlpha=r.l/.45*.8;c.strokeStyle='#fff';c.lineWidth=3;c.beginPath();c.arc(r.x,r.y,r.r,0,6.283);c.stroke()}}
  c.globalCompositeOperation='source-over';c.globalAlpha=1;
  if(t>1.55&&t<3.3){var k=Math.min(1,(t-1.55)/.18),fade=t>2.8?Math.max(0,1-(t-2.8)/.5):1;c.save();c.translate(W/2,Hh*.26);c.scale(.6+.4*(2-k)*k+(1-k)*1.6,.6+.4*(2-k)*k+(1-k)*1.6);c.globalAlpha=fade;c.font='28px Russo One,Rajdhani,sans-serif';c.textAlign='center';c.lineWidth=5;c.strokeStyle='#05070b';c.strokeText('KO',0,0);c.fillStyle='#ff3b5c';c.shadowColor='#ff3b5c';c.shadowBlur=18;c.fillText('KO',0,0);c.restore()}
  if(hero.flash>.01){c.globalAlpha=hero.flash;c.fillStyle='#fff';c.fillRect(0,0,W,Hh);c.globalAlpha=1;hero.flash*=.85}
}
requestAnimationFrame(heroFrame);
